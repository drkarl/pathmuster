[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
unused-allowed-license = "allow"
# Exactly the licences the dependency tree needs. Any other entry is added only
# with a comment naming the crate that requires it.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no registry version because
# nothing here is published; registry wildcards stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
